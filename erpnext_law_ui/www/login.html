{% extends "templates/base.html" %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

<style>
    footer, .web-footer, .footer-powered, .navbar { display: none !important; }
    
    body { 
        background-color: #f4f4f4; 
        font-family: 'Tajawal', sans-serif !important;
        margin: 0;
    }

    .main-wrapper { 
        min-height: 100vh; 
        display: flex; 
        flex-direction: column;
        align-items: center; 
        justify-content: center; 
        padding: 20px; 
    }

    .login-card { 
        width: 100%;
        max-width: 400px; 
        background: white; 
        border-radius: 12px; 
        overflow: hidden; 
        box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
    }

    .header-section {
        background: #111;
        padding: 35px 20px;
        text-align: center;
        border-bottom: 5px solid #d4af37;
    }

    .header-section h2 {
        color: #ffffff;
        font-family: 'Tajawal', sans-serif !important;
        font-weight: 800; /* أقصى درجة وضوح للخط */
        margin: 10px 0 5px 0;
        font-size: 24px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .lang-switcher {
        margin-bottom: 20px;
    }
    
    .btn-lang {
        background: transparent;
        color: #111 !important;
        border: 2px solid #111;
        padding: 6px 25px;
        border-radius: 20px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
    }
    .btn-lang:hover { background: #111; color: white !important; }

    .form-container { padding: 30px 40px; }
    .custom-label { font-weight: 700; color: #222; display: block; margin-bottom: 8px; font-size: 14px; }
    
    .custom-input {
        height: 45px !important;
        border-radius: 6px !important;
        border: 1px solid #bbb !important;
        padding: 0 12px !important;
        font-size: 15px !important;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 15px;
    }
    .custom-input:focus { border-color: #d4af37 !important; outline: none; }

    .btn-submit {
        width: 100%;
        height: 48px;
        background: #111;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }
    .btn-submit:hover { background: #333; transform: scale(1.01); }

    .rtl { direction: rtl; text-align: right; }
    .ltr { direction: ltr; text-align: left; }
</style>

<div class="main-wrapper rtl" id="main-area">
    
    <div class="lang-switcher">
        <button onclick="toggleLanguage()" id="lang-btn" class="btn-lang">English</button>
    </div>

    <div class="login-card">
        <div class="header-section">
            <div style="font-size: 45px;">⚖️</div>
            <h2 id="txt-title">نظام إدارة مكتب المحاماة</h2>
            <div id="txt-subtitle" style="color: #d4af37; font-size: 11px; font-weight: bold; letter-spacing: 1.5px;">SMART LAW OFFICE</div>
        </div>

        <div class="form-container">
            <form class="form-login">
                <label id="lbl-email" class="custom-label">البريد الإلكتروني</label>
                <input type="text" id="login_email" class="custom-input" placeholder="mail@example.com" required>

                <label id="lbl-pass" class="custom-label">كلمة المرور</label>
                <input type="password" id="login_password" class="custom-input" placeholder="••••••••" required>

                <button type="submit" class="btn-submit" id="btn-submit">تسجيل الدخول</button>
                <div id="status-msg" style="text-align: center; margin-top: 15px; font-weight: bold; font-size: 13px;"></div>
            </form>
        </div>
    </div>
</div>

<script>
const translations = {
    ar: { title: "نظام إدارة مكتب المحاماة", lblEmail: "البريد الإلكتروني", lblPass: "كلمة المرور", btnSubmit: "تسجيل الدخول", btnLang: "English", error: "البيانات خاطئة" },
    en: { title: "Law Office System", lblEmail: "Email Address", lblPass: "Password", btnSubmit: "Login", btnLang: "العربية", error: "Invalid login" }
};

let currentLang = 'ar';

function toggleLanguage() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    const t = translations[currentLang];
    document.getElementById('txt-title').innerText = t.title;
    document.getElementById('lbl-email').innerText = t.lblEmail;
    document.getElementById('lbl-pass').innerText = t.lblPass;
    document.getElementById('btn-submit').innerText = t.btnSubmit;
    document.getElementById('lang-btn').innerText = t.btnLang;
    document.getElementById('main-area').className = "main-wrapper " + (currentLang === 'ar' ? "rtl" : "ltr");
}

frappe.ready(function() {
    $(".form-login").on("submit", function(e) {
        e.preventDefault();
        $("#btn-submit").prop("disabled", true).text("...");

        const fallbackRedirect = setTimeout(() => { window.location.href = "/desk"; }, 1200);

        frappe.call({
            type: "POST",
            url: "/",
            args: {
                cmd: "login",
                usr: $("#login_email").val(),
                pwd: $("#login_password").val()
            },
            callback: function(r) {
                if (!r.exc) {
                    clearTimeout(fallbackRedirect);
                    window.location.href = "/desk";
                }
            },
            statusCode: {
                401: function() {
                    clearTimeout(fallbackRedirect);
                    $("#btn-submit").prop("disabled", false).text(translations[currentLang].btnSubmit);
                    $("#status-msg").css("color", "red").text(translations[currentLang].error);
                }
            }
        });
    });
});
</script>
{% endblock %}
